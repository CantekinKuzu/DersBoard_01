<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ders Göstergesi</title>
<style>
  :root{
    --bg:#38bdf8;
    --panel:rgba(15, 23, 42, 0.78);
    --panel-solid:#121a30;
    --line:rgba(255, 255, 255, 0.22);
    --txt:#f8fafc;
    --dim:#cbd5e1;
    --accent:#38bdf8;
    --warn:#fbbf24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#38bdf8; color:var(--txt);
    font-family:"Segoe UI",system-ui,sans-serif; overscroll-behavior:none;
  }

  /* Güneşli doğa manzarası arka planı (çevrimdışı SVG) */
  .bg-scene{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    width:100%; height:100%;
  }

  .wrap{
    position:relative; z-index:1;
    max-width:460px; width:100%; height:100vh; height:100dvh;
    margin:0 auto; padding:8px 10px 10px;
    display:flex; flex-direction:column; gap:8px; overflow:hidden;
  }

  /* gün sekmeleri */
  .days{display:flex; gap:4px; flex:0 0 auto;}
  .days button{
    flex:1; padding:9px 0; border:1px solid var(--line);
    background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:var(--dim); border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .days button.sel{background:var(--accent); border-color:#7dd3fc; color:#06131f;}
  .days button.today{box-shadow:inset 0 -3px 0 #fde047;}

  /* uçak kokpit göstergesi çerçevesi - kalan alana otomatik sığar */
  .gauge{
    position:relative; flex:1 1 0; min-height:0;
    background:linear-gradient(145deg, #273244 0%, #141b27 52%, #0c111a 100%);
    border:2px solid #3c4b64;
    box-shadow:
      0 8px 24px rgba(0, 0, 0, 0.48),
      inset 0 1px 1px rgba(255, 255, 255, 0.2),
      inset 0 -2px 6px rgba(0, 0, 0, 0.65);
    border-radius:16px;
    padding:8px;
    overflow:hidden;
    touch-action:none; user-select:none;
    display:flex; flex-direction:column; gap:6px;
  }

  /* üst kokpit bilgi bandı (dijital saat + mod) */
  .bezel-bar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 10px;
    background:#070b12;
    border:1px solid #28354b;
    border-radius:8px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.85);
  }
  .bezel-title{
    font-size:10px; letter-spacing:1.8px; color:#7c90b2; font-weight:700;
    text-transform:uppercase;
  }
  .bezel-readout{
    display:flex; align-items:baseline; gap:8px;
  }
  .bezel-readout .mode{
    font-size:10px; color:#38bdf8; letter-spacing:1.5px; font-weight:700;
    padding:2px 6px; border-radius:4px; background:rgba(56,189,248,0.14);
    border:1px solid rgba(56,189,248,0.35);
  }
  .bezel-readout .mode.manual{
    color:#fbbf24; background:rgba(251,191,36,0.14); border-color:rgba(251,191,36,0.4);
  }
  .bezel-readout .time{
    font-size:21px; font-weight:700; font-variant-numeric:tabular-nums;
    letter-spacing:1.5px; color:#e2f2ff;
    text-shadow:0 0 10px rgba(56,189,248,0.55);
  }

  .gauge-screen{
    position:relative; flex:1 1 0; min-height:0;
    background:#080d17;
    border:1.5px solid #2a3850;
    border-radius:10px;
    box-shadow:inset 0 0 18px rgba(0,0,0,0.9);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  svg#svg{
    display:block; width:100%; height:100%;
    max-width:100%; max-height:100%;
  }

  /* durum kartları */
  .status{display:flex; gap:8px; flex:0 0 auto;}
  .card{
    flex:1; min-width:0; background:var(--panel);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  }
  .card .lbl{font-size:10px; letter-spacing:1.2px; color:var(--dim); text-transform:uppercase;}
  .card .val{
    font-size:14.5px; font-weight:700; margin-top:2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .card .sub{
    font-size:11.5px; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}

  /* butonlar */
  .controls{display:flex; gap:8px; flex:0 0 auto;}
  .controls button{
    flex:1; padding:11px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:var(--txt); font-size:14px; font-weight:600; cursor:pointer;
  }
  .controls button.primary{background:var(--accent); border-color:#7dd3fc; color:#06131f;}

  /* tam ekran düzenleme paneli */
  .editor-modal{
    display:none; position:fixed; inset:0; z-index:20;
    background:#0b1020; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .editor-modal.open{display:block;}
  .editor-inner{
    max-width:460px; margin:0 auto; padding:12px 10px 28px;
  }
  .editor-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #24314f;
  }
  .editor-head h2{font-size:15px; margin:0; color:var(--txt); font-weight:700;}
  .editor-head .close-btn{
    padding:7px 14px; border-radius:8px; border:1px solid #24314f;
    background:#121a30; color:var(--txt); font-size:13px; font-weight:600; cursor:pointer;
  }
  .ed-days{display:flex; gap:4px; margin-bottom:10px;}
  .ed-days button{
    flex:1; padding:8px 0; border:1px solid #24314f; background:#121a30;
    color:#94a3b8; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .ed-days button.sel{background:var(--accent); border-color:var(--accent); color:#06131f;}
  .editor-box{
    background:#121a30; border:1px solid #24314f;
    border-radius:12px; padding:10px;
  }
  .row-card{
    background:#0d1530; border:1px solid #24314f; border-radius:9px;
    padding:7px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px;
  }
  .row-line{display:flex; gap:5px; align-items:center;}
  .row-line input[type=text]{
    min-width:0; background:#121a30; border:1px solid #2a395c;
    color:var(--txt); border-radius:6px; padding:7px 6px; font-size:13px;
  }
  .row-line input.f-p1{flex:0 0 58px; text-align:center;}
  .row-line input.f-p2{flex:0 0 64px; text-align:center;}
  .row-line input.f-n{flex:1;}
  .row-line input[type=color]{
    flex:0 0 34px; height:32px; padding:2px; background:#121a30;
    border:1px solid #2a395c; border-radius:6px; cursor:pointer;
  }
  .row-line input[type=time]{
    flex:1; min-width:0; background:#121a30; border:1px solid #2a395c;
    color:var(--txt); border-radius:6px; padding:6px 3px; font-size:12.5px;
    font-variant-numeric:tabular-nums;
  }
  .row-line .mv{
    flex:0 0 28px; background:#162242; border:1px solid #2a395c; color:#cbd5e1;
    border-radius:6px; padding:6px 0; font-size:13px; font-weight:700; cursor:pointer;
  }
  .row-line .mv:disabled{opacity:0.3; cursor:default;}
  .row-line .del{
    flex:0 0 30px; background:#2a1620; border:1px solid #4a2533; color:#f87171;
    border-radius:6px; padding:6px 0; font-size:13px; cursor:pointer;
  }
  .ebtns{display:flex; gap:6px; margin-top:10px;}
  .ebtns button{
    flex:1; padding:10px 4px; border-radius:8px;
    border:1px solid #24314f; background:#0d1530; color:var(--txt); font-size:13px;
    font-weight:600; cursor:pointer;
  }
  .ebtns .save{background:#22c55e; border-color:#22c55e; color:#06230f;}
  .hint{font-size:11px; color:#94a3b8; margin-top:8px; line-height:1.5;}

  /* Gelişmiş / Toplu işlemler */
  details.adv{
    margin-top:12px; padding-top:8px; border-top:1px solid #24314f;
  }
  details.adv summary{
    font-size:12px; color:#94a3b8; cursor:pointer; user-select:none;
    font-weight:600; padding:4px 0;
  }
  details.adv .adv-body{
    margin-top:8px; display:flex; flex-direction:column; gap:7px;
  }
  details.adv .adv-btn{
    width:100%; padding:9px; border-radius:8px;
    background:#162242; border:1px solid #2a395c; color:#e2e8f0;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
  details.adv .danger-btn{
    width:100%; padding:9px; border-radius:8px;
    background:#2a1620; border:1px solid #5c2838; color:#fca5a5;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
</style>
</head>
<body>

<!-- Güneşli Gün Doğa İllüstrasyonu -->
<svg class="bg-scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d74e8"/>
      <stop offset="48%" stop-color="#5bb6f9"/>
      <stop offset="78%" stop-color="#b6e3ff"/>
      <stop offset="100%" stop-color="#dff4ff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65c449"/>
      <stop offset="100%" stop-color="#358f29"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cd947"/>
      <stop offset="100%" stop-color="#2e8522"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8be34b"/>
      <stop offset="100%" stop-color="#226e1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="800" fill="url(#sky)"/>
  <circle cx="325" cy="95" r="78" fill="url(#sunGlow)"/>
  <circle cx="325" cy="95" r="24" fill="#fffbeb"/>
  <g fill="#ffffff" opacity="0.88">
    <ellipse cx="95" cy="115" rx="48" ry="18"/>
    <ellipse cx="122" cy="105" rx="34" ry="20"/>
    <ellipse cx="72" cy="112" rx="26" ry="14"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="270" cy="215" rx="54" ry="16"/>
    <ellipse cx="295" cy="204" rx="32" ry="17"/>
    <ellipse cx="242" cy="212" rx="28" ry="13"/>
  </g>
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="110" cy="310" rx="42" ry="12"/>
    <ellipse cx="132" cy="303" rx="24" ry="12"/>
  </g>
  <path d="M-20 555 Q120 470 250 530 T430 515 L430 800 L-20 800 Z" fill="url(#hillBack)"/>
  <path d="M-20 605 Q150 520 310 595 T440 580 L440 800 L-20 800 Z" fill="url(#hillMid)"/>
  <path d="M-20 665 Q190 590 420 675 L420 800 L-20 800 Z" fill="url(#hillFront)"/>
</svg>

<div class="wrap">
  <div class="days" id="days"></div>

  <!-- Uçak kokpit göstergesi çerçevesi -->
  <div class="gauge" id="gauge">
    <div class="bezel-bar">
      <div class="bezel-title">ZAMAN GÖSTERGESİ · 60°</div>
      <div class="bezel-readout">
        <div class="mode" id="mode">ŞİMDİ</div>
        <div class="time" id="clock">--:--</div>
      </div>
    </div>

    <div class="gauge-screen">
      <!--
        180° toplam skala, ekranda tek seferde 60° (-30° .. +30°) görünür.
        Çember merkezi ekran dışında solda: CX = -170, CY = 215
        R_IN = 196 (sol yay), R_OUT = 414 (sağ yay), R_TICK = 434 (tik yayı)
        60° yay yüksekliği = 2 * R_TICK * sin(30°) = 434 ≈ viewBox yüksekliği (430)
      -->
      <svg id="svg" viewBox="0 0 320 430" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Silindirik derinlik gölgesi (üst ve alt kenarlar hafif karartılır) -->
          <linearGradient id="drumShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#04070d" stop-opacity="0.72"/>
            <stop offset="18%" stop-color="#04070d" stop-opacity="0.16"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
            <stop offset="82%" stop-color="#04070d" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#04070d" stop-opacity="0.72"/>
          </linearGradient>
          <!-- Cam yansıması -->
          <linearGradient id="glassGlare" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
            <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
          </linearGradient>
          <clipPath id="vpClip">
            <rect x="0" y="0" width="320" height="430"/>
          </clipPath>
        </defs>

        <!-- Dönen 180° gösterge tamburu -->
        <g clip-path="url(#vpClip)">
          <g id="rot"></g>

          <!-- Silindirik gölge ve cam efekti -->
          <rect x="0" y="0" width="320" height="430" fill="url(#drumShade)" pointer-events="none"/>
          <rect x="0" y="0" width="320" height="430" fill="url(#glassGlare)" pointer-events="none"/>

          <!-- Sabit orta referans hattı (uçak göstergesi lubber line) -->
          <line x1="8" y1="215" x2="296" y2="215" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55" pointer-events="none"/>

          <!-- Sol sabit indeks işareti -->
          <path d="M2 208 L14 215 L2 222 Z" fill="#fbbf24" pointer-events="none"/>

          <!-- Sağ sabit ibre (uçak göstergesi üçgen işaretçi) -->
          <line x1="316" y1="215" x2="274" y2="215" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" pointer-events="none"/>
          <path d="M318 205 L318 225 L298 215 Z" fill="#fbbf24" stroke="#080d17" stroke-width="1" pointer-events="none"/>
        </g>

        <!-- 4 köşe kokpit vida detayları -->
        <g fill="#263349" stroke="#475a78" stroke-width="1" pointer-events="none">
          <circle cx="10" cy="10" r="3.5"/>
          <circle cx="310" cy="10" r="3.5"/>
          <circle cx="10" cy="420" r="3.5"/>
          <circle cx="310" cy="420" r="3.5"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="status">
    <div class="card">
      <div class="lbl">Bu an</div>
      <div class="val" id="curName">—</div>
      <div class="sub" id="curSub"></div>
    </div>
    <div class="card">
      <div class="lbl">Sıradaki</div>
      <div class="val" id="nextName">—</div>
      <div class="sub" id="nextSub"></div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="nowBtn">Şimdi</button>
    <button id="editBtn">Düzenle</button>
  </div>
</div>

<!-- Tam ekran düzenleme penceresi -->
<div class="editor-modal" id="editorModal">
  <div class="editor-inner">
    <div class="editor-head">
      <h2 id="editTitle">Program Düzenle</h2>
      <button class="close-btn" id="closeEditor">Kapat ✕</button>
    </div>
    <div class="ed-days" id="edDays"></div>
    <div class="editor-box">
      <div id="rows"></div>
      <div class="ebtns">
        <button id="addRow">+ Dilim ekle</button>
        <button class="save" id="saveBtn">Kaydet</button>
      </div>
      <div class="hint">
        <b>Bölüm 1:</b> Ders no / Ara · <b>Bölüm 2:</b> Sınıf · <b>Bölüm 3:</b> Ders adı.
        <b>↑ / ↓</b> butonlarıyla dilimleri taşıyabilir, <b>✕</b> ile silebilirsiniz.
      </div>
      <details class="adv" id="advBox">
        <summary>Gelişmiş / Toplu İşlemler</summary>
        <div class="adv-body">
          <button class="adv-btn" id="loadTemplateDay">Bu güne hazır ders şablonunu yükle (09:00–16:30)</button>
          <button class="danger-btn" id="copyDay">Bu günü diğer tüm günlere kopyala</button>
        </div>
      </details>
    </div>
  </div>
</div>

<script>
"use strict";
const DAYS=["Pzt","Sal","Çar","Per","Cum"];
const START=8*60+30, END=17*60, SPAN=END-START;       // 08:30–17:00 = 180°
const ARC_DEG=180;
const CX=-170, CY=215, R_IN=196, R_OUT=414, R_TICK=434;

// ---- yardımcılar ----
const pad=n=>String(n).padStart(2,"0");
const fmt=m=>pad(Math.floor(m/60))+":"+pad(Math.floor(m%60));
const toMin=s=>{const[a,b]=s.split(":").map(Number); return a*60+b;};
const clamp=t=>Math.min(Math.max(t,START),END);
const a4t=t=>(t-START)/SPAN*ARC_DEG;
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function pol(ang,r){const a=ang*Math.PI/180; return [CX+r*Math.cos(a), CY+r*Math.sin(a)];}

function wedgePath(a1,a2,rIn,rOut){
  const large=(a2-a1)>180?1:0;
  const [x1,y1]=pol(a1,rOut), [x2,y2]=pol(a2,rOut);
  const [x3,y3]=pol(a2,rIn),  [x4,y4]=pol(a1,rIn);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${rOut} ${rOut} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${rIn} ${rIn} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
}

function arcLine(a1,a2,r){
  const large=(a2-a1)>180?1:0;
  const [x1,y1]=pol(a1,r), [x2,y2]=pol(a2,r);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

function fullLabel(s){
  return [s.p1, s.p2, s.n].map(x=>(x||"").trim()).filter(Boolean).join(" · ") || "—";
}

// ---- hazır şablon ----
function createDefaultDay(){
  return [
    {p1:"1",     p2:"", n:"Ders 1", c:"#38bdf8", s:toMin("09:00"), e:toMin("09:40")},
    {p1:"Ara",   p2:"", n:"",       c:"#94a3b8", s:toMin("09:40"), e:toMin("09:50")},
    {p1:"2",     p2:"", n:"Ders 2", c:"#34d399", s:toMin("09:50"), e:toMin("10:30")},
    {p1:"Ara",   p2:"", n:"",       c:"#94a3b8", s:toMin("10:30"), e:toMin("10:40")},
    {p1:"3",     p2:"", n:"Ders 3", c:"#38bdf8", s:toMin("10:40"), e:toMin("11:20")},
    {p1:"Ara",   p2:"", n:"",       c:"#94a3b8", s:toMin("11:20"), e:toMin("11:25")},
    {p1:"4",     p2:"", n:"Ders 4", c:"#34d399", s:toMin("11:25"), e:toMin("12:05")},
    {p1:"Yemek", p2:"", n:"Öğle",   c:"#fbbf24", s:toMin("12:05"), e:toMin("12:45")},
    {p1:"5",     p2:"", n:"Ders 5", c:"#818cf8", s:toMin("12:45"), e:toMin("13:25")},
    {p1:"Ara",   p2:"", n:"",       c:"#94a3b8", s:toMin("13:25"), e:toMin("13:30")},
    {p1:"6",     p2:"", n:"Ders 6", c:"#2dd4bf", s:toMin("13:30"), e:toMin("14:10")},
    {p1:"Ara",   p2:"", n:"",       c:"#94a3b8", s:toMin("14:10"), e:toMin("14:20")},
    {p1:"7",     p2:"", n:"Ders 7", c:"#818cf8", s:toMin("14:20"), e:toMin("15:00")},
    {p1:"Ara",   p2:"", n:"",       c:"#94a3b8", s:toMin("15:00"), e:toMin("15:05")},
    {p1:"8",     p2:"", n:"Ders 8", c:"#2dd4bf", s:toMin("15:05"), e:toMin("15:45")},
    {p1:"Ara",   p2:"", n:"",       c:"#94a3b8", s:toMin("15:45"), e:toMin("15:50")},
    {p1:"9",     p2:"", n:"Ders 9", c:"#fb7185", s:toMin("15:50"), e:toMin("16:30")}
  ];
}

// ---- veri ----
let schedule={};
let hasSaved=false;
try{
  const raw=localStorage.getItem("dersGauge.v2");
  if(raw){
    const p=JSON.parse(raw);
    if(p&&typeof p==="object"){
      schedule=p;
      hasSaved=Object.values(p).some(arr=>Array.isArray(arr)&&arr.length>0);
    }
  }
}catch(e){}

function saveStore(){ try{localStorage.setItem("dersGauge.v2",JSON.stringify(schedule));}catch(e){} }

if(!hasSaved){
  for(let i=0;i<5;i++) schedule[i]=createDefaultDay();
  saveStore();
}else{
  for(let i=0;i<5;i++) if(!Array.isArray(schedule[i])) schedule[i]=[];
}

function segsFor(day){ return (schedule[day]||[]).slice().sort((a,b)=>a.s-b.s); }

// ---- durum ----
function getTodayIdx(){
  const wd=(new Date().getDay()+6)%7; // 0=Pzt .. 4=Cum, 5=Cmt, 6=Paz
  return wd<5?wd:-1;
}
let todayIdx=getTodayIdx();
let selDay=todayIdx>=0?todayIdx:0;
let live=true, viewTime=START, dragging=false, lastAng=0;

// ---- çizim (180° tambur, 60° görüş açılı uçak göstergesi) ----
const rot=document.getElementById("rot");
function buildRing(){
  let h="";

  // 180° zemin şeridi (08:30–17:00 + küçük baş/son marjı)
  h+=`<path d="${wedgePath(-12, ARC_DEG+12, R_IN, R_OUT)}" fill="#101829" stroke="#24334d" stroke-width="1.5"/>`;

  // ders ve ara dilimleri
  for(const s of segsFor(selDay)){
    const a1=a4t(clamp(s.s)), a2=a4t(clamp(s.e));
    const da=a2-a1;
    if(da<=0) continue;

    h+=`<path d="${wedgePath(a1,a2,R_IN,R_OUT)}" fill="${s.c}" fill-opacity="0.88" stroke="#080d17" stroke-width="1.4"/>`;

    const mid=(a1+a2)/2;
    const p1=(s.p1||"").trim().slice(0,5);
    const p2=(s.p2||"").trim().slice(0,6);
    const p3=(s.n||"").trim().slice(0,18);

    // 180° skalada 10 dk ≈ 3.5°, 40 dk ≈ 14.1°
    if(da>=2.8){
      const small=da<6;
      const fs1=small?9.5:12.5;
      const fs2=small?9.5:12.5;
      const fs3=small?10:13.5;
      h+=`<g transform="rotate(${mid.toFixed(2)} ${CX} ${CY})" fill="#06131f" font-weight="700" dominant-baseline="central">`;
      if(p1){
        h+=`<text x="${CX+222}" y="${CY}" font-size="${fs1}" text-anchor="middle">${esc(p1)}</text>`;
      }
      if(p2){
        h+=`<text x="${CX+268}" y="${CY}" font-size="${fs2}" text-anchor="middle">${esc(p2)}</text>`;
      }
      if(p3){
        const startX=(p1||p2)?(CX+296):(CX+220);
        h+=`<text x="${startX}" y="${CY}" font-size="${fs3}" text-anchor="start">${esc(p3)}</text>`;
      }
      h+=`</g>`;
    }
  }

  // Sütun ayırıcı ince yaylar (Bölüm 1 | Bölüm 2 | Bölüm 3)
  h+=`<path d="${arcLine(0, ARC_DEG, 246)}" fill="none" stroke="rgba(6,19,31,0.28)" stroke-width="1" stroke-dasharray="3 3"/>`;
  h+=`<path d="${arcLine(0, ARC_DEG, 288)}" fill="none" stroke="rgba(6,19,31,0.28)" stroke-width="1" stroke-dasharray="3 3"/>`;

  // İç ve dış kılavuz yayları (gösterge sınır çizgileri)
  h+=`<path d="${arcLine(-12, ARC_DEG+12, R_IN)}" fill="none" stroke="#475a78" stroke-width="1.5"/>`;
  h+=`<path d="${arcLine(-12, ARC_DEG+12, R_OUT)}" fill="none" stroke="#64748b" stroke-width="1.5"/>`;
  h+=`<path d="${arcLine(0, ARC_DEG, R_TICK)}" fill="none" stroke="#334155" stroke-width="1"/>`;

  // Başlangıç (08:30) ve bitiş (17:00) sınır çizgileri
  for(const lim of [0, ARC_DEG]){
    const [x1,y1]=pol(lim, R_IN), [x2,y2]=pol(lim, R_TICK);
    h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>`;
  }

  // Hassas uçak göstergesi tikleri (5 dk, 10 dk, 30 dk, 60 dk) + saat rakamları
  for(let m=START; m<=END; m+=5){
    const ang=a4t(m);
    const hour=m%60===0, half=m%30===0, ten=m%10===0;
    const len=hour?18:(half?13:(ten?8:5));
    const [x1,y1]=pol(ang, R_TICK), [x2,y2]=pol(ang, R_TICK-len);
    const col=hour?"#f8fafc":(half?"#cbd5e1":"#64748b");
    const sw=hour?2:(half?1.4:1);
    h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}"/>`;

    if(hour){
      const [tx,ty]=pol(ang, R_TICK+17);
      h+=`<text x="${tx}" y="${ty}" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle" dominant-baseline="central" transform="rotate(${ang.toFixed(2)} ${tx} ${ty})">${pad(m/60)}</text>`;
    }else if(half){
      const [tx,ty]=pol(ang, R_TICK+15);
      h+=`<text x="${tx}" y="${ty}" font-size="9.5" font-weight="600" fill="#94a3b8" text-anchor="middle" dominant-baseline="central" transform="rotate(${ang.toFixed(2)} ${tx} ${ty})">:30</text>`;
    }
  }

  rot.innerHTML=h;
}
function setRotation(){ rot.setAttribute("transform",`rotate(${(-a4t(viewTime)).toFixed(3)} ${CX} ${CY})`); }

// ---- durum kartları ----
function updateStatus(){
  const segs=segsFor(selDay), t=viewTime;
  const cur=segs.find(s=>t>=s.s&&t<s.e);
  const nxt=segs.find(s=>s.s>t);
  const cN=document.getElementById("curName"),cS=document.getElementById("curSub");
  const nN=document.getElementById("nextName"),nS=document.getElementById("nextSub");
  if(cur){
    cN.innerHTML=`<span class="dot" style="background:${cur.c}"></span>${esc(fullLabel(cur))}`;
    cS.textContent=`${fmt(cur.s)}–${fmt(cur.e)} · ${Math.ceil(cur.e-t)} dk`;
  }else{
    cN.textContent=segs.length?"Boş":"Program yok"; cS.textContent="";
  }
  if(nxt){
    nN.innerHTML=`<span class="dot" style="background:${nxt.c}"></span>${esc(fullLabel(nxt))}`;
    nS.textContent=`${fmt(nxt.s)} · ${Math.ceil(nxt.s-t)} dk sonra`;
  }else{nN.textContent="—"; nS.textContent="";}
  document.getElementById("clock").textContent=fmt(viewTime);
  const mode=document.getElementById("mode");
  const nowRaw=nowMin();
  mode.textContent=live?(nowRaw<START||nowRaw>END?"GÜN DIŞI":"ŞİMDİ"):"ELLE";
  mode.className="mode"+(live?"":" manual");
}
function refresh(){ setRotation(); updateStatus(); }

// ---- gün sekmeleri ----
function buildDays(){
  const el=document.getElementById("days"); el.innerHTML="";
  DAYS.forEach((d,i)=>{
    const b=document.createElement("button");
    b.textContent=d;
    b.className=(i===selDay?"sel ":"")+(i===todayIdx?"today":"");
    b.onclick=()=>{selDay=i; buildDays(); buildRing(); refresh();};
    el.appendChild(b);
  });
}

// ---- şimdi modu ----
function nowMin(){const d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
function tick(){
  const tIdx=getTodayIdx();
  if(tIdx!==todayIdx){
    todayIdx=tIdx;
    buildDays();
  }
  if(live){ viewTime=clamp(nowMin()); refresh(); }
}
setInterval(tick,1000);

document.getElementById("nowBtn").onclick=()=>{
  todayIdx=getTodayIdx();
  if(todayIdx>=0 && selDay!==todayIdx){
    selDay=todayIdx;
    buildDays();
    buildRing();
  }
  live=true;
  viewTime=clamp(nowMin());
  refresh();
};

// ---- sürükleme (180° skalaya göre) ----
const svg=document.getElementById("svg");
function angOf(ev){
  const pt=svg.createSVGPoint();
  pt.x=ev.clientX; pt.y=ev.clientY;
  const ctm=svg.getScreenCTM();
  if(ctm){
    const p=pt.matrixTransform(ctm.inverse());
    return Math.atan2(p.y-CY, p.x-CX)*180/Math.PI;
  }
  const r=svg.getBoundingClientRect();
  const x=(ev.clientX-r.left)*(320/r.width), y=(ev.clientY-r.top)*(430/r.height);
  return Math.atan2(y-CY,x-CX)*180/Math.PI;
}
svg.addEventListener("pointerdown",ev=>{dragging=true; lastAng=angOf(ev); svg.setPointerCapture(ev.pointerId);});
svg.addEventListener("pointermove",ev=>{
  if(!dragging) return;
  let d=angOf(ev)-lastAng;
  if(d>180)d-=360; if(d<-180)d+=360;
  lastAng=angOf(ev);
  live=false;
  viewTime=clamp(viewTime - d/ARC_DEG*SPAN);
  refresh();
});
["pointerup","pointercancel"].forEach(e=>svg.addEventListener(e,()=>dragging=false));

// ---- düzenle modalı ----
const PALETTE=["#38bdf8","#34d399","#fbbf24","#818cf8","#fb7185","#2dd4bf"];
const editorModal=document.getElementById("editorModal");

document.getElementById("editBtn").onclick=()=>{
  document.getElementById("advBox").open=false;
  buildEditor();
  editorModal.classList.add("open");
};
document.getElementById("closeEditor").onclick=()=>{
  editorModal.classList.remove("open");
  buildDays(); buildRing(); refresh();
};

// Dilim taşıma (süreleri koruyarak saatleri günceller)
function moveRow(i, dir){
  const arr=schedule[selDay];
  const j=i+dir;
  if(j<0||j>=arr.length) return;
  const idx1=Math.min(i,j), idx2=Math.max(i,j);
  const a=arr[idx1], b=arr[idx2];
  const durA=Math.max(5, a.e-a.s);
  const durB=Math.max(5, b.e-b.s);
  const contiguous=Math.abs(a.e-b.s)<=1;
  const start0=a.s;

  arr[idx1]=b; arr[idx2]=a;

  if(contiguous){
    b.s=start0;
    b.e=Math.min(END, start0+durB);
    a.s=b.e;
    a.e=Math.min(END, a.s+durA);
  }else{
    const ts=a.s, te=a.e;
    a.s=b.s; a.e=b.e;
    b.s=ts;  b.e=te;
  }
  buildEditor();
}

function buildEditor(){
  document.getElementById("editTitle").textContent=DAYS[selDay]+" Programı";
  const edDays=document.getElementById("edDays"); edDays.innerHTML="";
  DAYS.forEach((d,i)=>{
    const b=document.createElement("button");
    b.textContent=d;
    if(i===selDay) b.className="sel";
    b.onclick=()=>{selDay=i; buildEditor();};
    edDays.appendChild(b);
  });

  const arr=schedule[selDay]||[];
  const rows=document.getElementById("rows"); rows.innerHTML="";
  arr.forEach((b,i)=>{
    const card=document.createElement("div"); card.className="row-card";
    card.innerHTML=`
      <div class="row-line">
        <input class="f-p1" type="text" value="${esc(b.p1)}" placeholder="No/Ara" data-i="${i}" data-f="p1">
        <input class="f-p2" type="text" value="${esc(b.p2)}" placeholder="Sınıf" data-i="${i}" data-f="p2">
        <input class="f-n"  type="text" value="${esc(b.n)}"  placeholder="Ders adı" data-i="${i}" data-f="n">
      </div>
      <div class="row-line">
        <input type="color" value="${b.c}" data-i="${i}" data-f="c">
        <input type="time" value="${fmt(b.s)}" data-i="${i}" data-f="s">
        <input type="time" value="${fmt(b.e)}" data-i="${i}" data-f="e">
        <button class="mv" data-i="${i}" data-dir="-1" ${i===0?"disabled":""} title="Yukarı taşı">↑</button>
        <button class="mv" data-i="${i}" data-dir="1" ${i===arr.length-1?"disabled":""} title="Aşağı taşı">↓</button>
        <button class="del" data-i="${i}" title="Sil">✕</button>
      </div>`;
    rows.appendChild(card);
  });

  rows.querySelectorAll("input").forEach(el=>{
    el.onchange=()=>{
      const b=schedule[selDay][+el.dataset.i], f=el.dataset.f;
      if(f==="n"||f==="c"||f==="p1"||f==="p2") b[f]=el.value; else b[f]=toMin(el.value);
    };
  });
  rows.querySelectorAll(".mv").forEach(el=>{
    el.onclick=()=>moveRow(+el.dataset.i, +el.dataset.dir);
  });
  rows.querySelectorAll(".del").forEach(el=>{
    el.onclick=()=>{schedule[selDay].splice(+el.dataset.i,1); buildEditor();};
  });
}

document.getElementById("addRow").onclick=()=>{
  const b=schedule[selDay]||(schedule[selDay]=[]);
  const last=b.length?Math.max(...b.map(x=>x.e)):toMin("09:00");
  b.push({p1:"", p2:"", n:"", c:PALETTE[b.length%PALETTE.length], s:Math.min(last,END-40), e:Math.min(last+40,END)});
  buildEditor();
};

document.getElementById("loadTemplateDay").onclick=()=>{
  if(!confirm(DAYS[selDay]+" günü 09:00–16:30 hazır ders şablonu ile değiştirilecek. Emin misiniz?")) return;
  schedule[selDay]=createDefaultDay();
  saveStore(); buildRing(); buildEditor(); refresh();
  document.getElementById("advBox").open=false;
  toast("Hazır şablon yüklendi.");
};

document.getElementById("copyDay").onclick=()=>{
  if(!confirm(DAYS[selDay]+" programı diğer tüm günlerin üzerine yazılacak. Emin misiniz?")) return;
  for(let i=0;i<5;i++) if(i!==selDay) schedule[i]=schedule[selDay].map(b=>({...b}));
  saveStore();
  document.getElementById("advBox").open=false;
  toast("Tüm günlere kopyalandı.");
};

document.getElementById("saveBtn").onclick=()=>{
  schedule[selDay].sort((a,b)=>a.s-b.s);
  saveStore(); buildDays(); buildRing(); buildEditor(); refresh(); toast("Kaydedildi.");
};

function toast(msg){
  const n=document.createElement("div");
  n.textContent=msg;
  n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22c55e;color:#06230f;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:30";
  document.body.appendChild(n); setTimeout(()=>n.remove(),1600);
}

// ---- başlat ----
viewTime=clamp(nowMin());
buildDays(); buildRing(); refresh();
</script>
</body>
</html>
