<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ders Göstergesi</title>
<style>
  :root{
    --bg:#38bdf8;
    --panel:rgba(15, 23, 42, 0.72);
    --panel-solid:#121a30;
    --line:rgba(255, 255, 255, 0.22);
    --txt:#f8fafc;
    --dim:#cbd5e1;
    --accent:#38bdf8;
    --warn:#fbbf24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#38bdf8; color:var(--txt);
    font-family:"Segoe UI",system-ui,sans-serif; overscroll-behavior:none;
  }

  /* Güneşli doğa manzarası arka planı (çevrimdışı SVG) */
  .bg-scene{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    width:100%; height:100%;
  }

  .wrap{
    position:relative; z-index:1;
    max-width:460px; width:100%; height:100vh; height:100dvh;
    margin:0 auto; padding:8px 10px 10px;
    display:flex; flex-direction:column; gap:8px; overflow:hidden;
  }

  /* gün sekmeleri */
  .days{display:flex; gap:4px; flex:0 0 auto;}
  .days button{
    flex:1; padding:9px 0; border:1px solid var(--line);
    background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:var(--dim); border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .days button.sel{background:var(--accent); border-color:#7dd3fc; color:#06131f;}
  .days button.today{box-shadow:inset 0 -3px 0 #fde047;}

  /* dikey gösterge - kalan alana otomatik sığar */
  .gauge{
    position:relative; flex:1 1 0; min-height:0;
    background:rgba(15, 23, 42, 0.36);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    touch-action:none; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  svg#svg{
    display:block; width:100%; height:100%;
    max-width:100%; max-height:100%;
  }
  .readout{
    position:absolute; right:10px; top:50%; transform:translateY(-130%);
    text-align:right; pointer-events:none;
    background:rgba(15, 23, 42, 0.55); padding:4px 8px; border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
  }
  .readout .time{
    font-size:clamp(20px, 6vw, 26px); font-weight:700; font-variant-numeric:tabular-nums;
    letter-spacing:1px; color:#fff; text-shadow:0 1px 8px rgba(0,0,0,.5);
  }
  .readout .mode{font-size:10px; color:#7dd3fc; letter-spacing:2px; font-weight:700;}
  .readout .mode.manual{color:var(--warn);}

  /* durum kartları */
  .status{display:flex; gap:8px; flex:0 0 auto;}
  .card{
    flex:1; min-width:0; background:var(--panel);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  }
  .card .lbl{font-size:10px; letter-spacing:1.2px; color:var(--dim); text-transform:uppercase;}
  .card .val{
    font-size:14.5px; font-weight:700; margin-top:2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .card .sub{
    font-size:11.5px; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}

  /* butonlar */
  .controls{display:flex; gap:8px; flex:0 0 auto;}
  .controls button{
    flex:1; padding:11px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    color:var(--txt); font-size:14px; font-weight:600; cursor:pointer;
  }
  .controls button.primary{background:var(--accent); border-color:#7dd3fc; color:#06131f;}

  /* tam ekran düzenleme paneli */
  .editor-modal{
    display:none; position:fixed; inset:0; z-index:20;
    background:#0b1020; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .editor-modal.open{display:block;}
  .editor-inner{
    max-width:460px; margin:0 auto; padding:12px 10px 28px;
  }
  .editor-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #24314f;
  }
  .editor-head h2{font-size:15px; margin:0; color:var(--txt); font-weight:700;}
  .editor-head .close-btn{
    padding:7px 14px; border-radius:8px; border:1px solid #24314f;
    background:#121a30; color:var(--txt); font-size:13px; font-weight:600; cursor:pointer;
  }
  .ed-days{display:flex; gap:4px; margin-bottom:10px;}
  .ed-days button{
    flex:1; padding:8px 0; border:1px solid #24314f; background:#121a30;
    color:#94a3b8; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .ed-days button.sel{background:var(--accent); border-color:var(--accent); color:#06131f;}
  .editor-box{
    background:#121a30; border:1px solid #24314f;
    border-radius:12px; padding:10px;
  }
  .row-card{
    background:#0d1530; border:1px solid #24314f; border-radius:9px;
    padding:7px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px;
  }
  .row-line{display:flex; gap:5px; align-items:center;}
  .row-line input[type=text]{
    min-width:0; background:#121a30; border:1px solid #2a395c;
    color:var(--txt); border-radius:6px; padding:7px 6px; font-size:13px;
  }
  .row-line input.f-p1{flex:0 0 54px; text-align:center;}
  .row-line input.f-p2{flex:0 0 64px; text-align:center;}
  .row-line input.f-n{flex:1;}
  .row-line input[type=color]{
    flex:0 0 36px; height:32px; padding:2px; background:#121a30;
    border:1px solid #2a395c; border-radius:6px; cursor:pointer;
  }
  .row-line input[type=time]{
    flex:1; background:#121a30; border:1px solid #2a395c;
    color:var(--txt); border-radius:6px; padding:6px 4px; font-size:13px;
    font-variant-numeric:tabular-nums;
  }
  .row-line .del{
    flex:0 0 32px; background:#2a1620; border:1px solid #4a2533; color:#f87171;
    border-radius:6px; padding:6px 0; font-size:13px; cursor:pointer;
  }
  .ebtns{display:flex; gap:6px; margin-top:10px;}
  .ebtns button{
    flex:1; padding:10px 4px; border-radius:8px;
    border:1px solid #24314f; background:#0d1530; color:var(--txt); font-size:13px;
    font-weight:600; cursor:pointer;
  }
  .ebtns .save{background:#22c55e; border-color:#22c55e; color:#06230f;}
  .hint{font-size:11px; color:#94a3b8; margin-top:8px; line-height:1.5;}

  /* Gelişmiş / Toplu işlemler (kazayla basmayı önlemek için gizli) */
  details.adv{
    margin-top:12px; padding-top:8px; border-top:1px solid #24314f;
  }
  details.adv summary{
    font-size:12px; color:#94a3b8; cursor:pointer; user-select:none;
    font-weight:600; padding:4px 0;
  }
  details.adv .adv-body{margin-top:8px;}
  details.adv .danger-btn{
    width:100%; padding:9px; border-radius:8px;
    background:#2a1620; border:1px solid #5c2838; color:#fca5a5;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
</style>
</head>
<body>

<!-- Güneşli Gün Doğa İllüstrasyonu (Win XP esintili) -->
<svg class="bg-scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d74e8"/>
      <stop offset="48%" stop-color="#5bb6f9"/>

    <ellipse cx="270" cy="215" rx="54" ry="16"/>

  <!-- Yeşil tepeler -->
  <path d="M-20 555 Q120 470 250 530 T430 515 L430 800 L-20 800 Z" fill="url(#hillBack)"/>
  <path d="M-20 605 Q150 520 310 595 T440 580 L440 800 L-20 800 Z" fill="url(#hillMid)"/>
  <path d="M-20 665 Q190 590 420 675 L420 800 L-20 800 Z" fill="url(#hillFront)"/>
</svg>

<div class="wrap">
  <div class="days" id="days"></div>

  <div class="gauge" id="gauge">
    <svg id="svg" viewBox="0 0 320 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <g id="rot"></g>
      <!-- merkez göbek -->
      <circle cx="10" cy="280" r="24" fill="#0f172a" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
      <!-- sabit ibre (yatay, sağda) -->
      <line x1="314" y1="280" x2="274" y2="280" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M314 271 L314 289 L298 280 Z" fill="#ffffff"/>
    </svg>
    <div class="readout">
      <div class="time" id="clock">--:--</div>
      <div class="mode" id="mode">ŞİMDİ</div>
    </div>
  </div>

  <div class="status">
    <div class="card">
      <div class="lbl">Bu an</div>
      <div class="val" id="curName">—</div>
      <div class="sub" id="curSub"></div>
    </div>
    <div class="card">
      <div class="lbl">Sıradaki</div>
      <div class="val" id="nextName">—</div>
      <div class="sub" id="nextSub"></div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="nowBtn">Şimdi</button>
    <button id="editBtn">Düzenle</button>

</div>

<!-- Tam ekran düzenleme penceresi -->
<div class="editor-modal" id="editorModal">
  <div class="editor-inner">
    <div class="editor-head">
      <h2 id="editTitle">Program Düzenle</h2>
      <button class="close-btn" id="closeEditor">Kapat ✕</button>
    </div>
    <div class="ed-days" id="edDays"></div>
    <div class="editor-box">
      <div id="rows"></div>
      <div class="ebtns">
        <button id="addRow">+ Dilim ekle</button>
        <button class="save" id="saveBtn">Kaydet</button>
      </div>
      <div class="hint">
        <b>Bölüm 1:</b> Ders no / Ara (örn. 5) · <b>Bölüm 2:</b> Sınıf (örn. 10C) · <b>Bölüm 3:</b> Ders adı (örn. Proje Tasarımı).
        Gösterge aralığı 08:30–17:00; kayıt cihazda saklanır.
      </div>
      <details class="adv" id="advBox">
        <summary>Gelişmiş / Toplu İşlemler</summary>
        <div class="adv-body">
          <button class="danger-btn" id="copyDay">Bu günü diğer tüm günlere kopyala</button>
        </div>
      </details>
    </div>
  </div>
</div>

<script>
"use strict";
const DAYS=["Pzt","Sal","Çar","Per","Cum"];
const START=8*60+30, END=17*60, SPAN=END-START;       // 08:30–17:00 = 360°
const CX=10, CY=280, R_IN=26, R_OUT=220, R_TICK=240;

// ---- yardımcılar ----
const pad=n=>String(n).padStart(2,"0");
const fmt=m=>pad(Math.floor(m/60))+":"+pad(Math.floor(m%60));
const toMin=s=>{const[a,b]=s.split(":").map(Number); return a*60+b;};
const clamp=t=>Math.min(Math.max(t,START),END);
const a4t=t=>(t-START)/SPAN*360;
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function pol(ang,r){const a=ang*Math.PI/180; return [CX+r*Math.cos(a), CY+r*Math.sin(a)];}

function wedgePath(a1,a2,rIn,rOut){
  const large=(a2-a1)>180?1:0;
  const [x1,y1]=pol(a1,rOut), [x2,y2]=pol(a2,rOut);
  const [x3,y3]=pol(a2,rIn),  [x4,y4]=pol(a1,rIn);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${rOut} ${rOut} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${rIn} ${rIn} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
}

function fullLabel(s){
  return [s.p1, s.p2, s.n].map(x=>(x||"").trim()).filter(Boolean).join(" · ") || "—";
}

// ---- veri ----
let schedule={};
for(let i=0;i<5;i++) schedule[i]=[];
try{
  const raw=localStorage.getItem("dersGauge.v2");
  if(raw){const p=JSON.parse(raw); if(p&&typeof p==="object") schedule=p;}
}catch(e){}
function saveStore(){ try{localStorage.setItem("dersGauge.v2",JSON.stringify(schedule));}catch(e){} }
function segsFor(day){ return (schedule[day]||[]).slice().sort((a,b)=>a.s-b.s); }

// ---- durum ----
function getTodayIdx(){
  const wd=(new Date().getDay()+6)%7; // 0=Pzt .. 4=Cum, 5=Cmt, 6=Paz
  return wd<5?wd:-1;
}
let todayIdx=getTodayIdx();
let selDay=todayIdx>=0?todayIdx:0;
let live=true, viewTime=START, dragging=false, lastAng=0;

// ---- çizim (pizza dilimi + 3 bölümlü radyal metin) ----
const rot=document.getElementById("rot");
function buildRing(){
  let h="";
  // zemin diski
  h+=`<circle cx="${CX}" cy="${CY}" r="${R_OUT}" fill="rgba(15,23,42,0.45)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>`;

  // pizza dilimleri
  for(const s of segsFor(selDay)){
    const a1=a4t(clamp(s.s)), a2=a4t(clamp(s.e));
    const da=a2-a1;
    if(da<=0) continue;

    h+=`<path d="${wedgePath(a1,a2,R_IN,R_OUT)}" fill="${s.c}" fill-opacity="0.92" stroke="#0f172a" stroke-width="1.5"/>`;

    // metin yerleşimi (merkezden dışa: Bölüm 1, Bölüm 2, Bölüm 3)
    const mid=(a1+a2)/2;
    const p1=(s.p1||"").trim().slice(0,5);
    const p2=(s.p2||"").trim().slice(0,6);
    const p3=(s.n||"").trim().slice(0,18);

    if(da>=6){
      const fs1=da<11?9:11;
      const fs2=da<11?9.5:11.5;
      const fs3=da<11?10:12.5;
      h+=`<g transform="rotate(${mid.toFixed(2)} ${CX} ${CY})" fill="#06131f" font-weight="700" dominant-baseline="central">`;
      if(p1 && da>=9){
        h+=`<text x="${CX+50}" y="${CY}" font-size="${fs1}" text-anchor="middle">${esc(p1)}</text>`;
      }
      if(p2 && da>=8){
        h+=`<text x="${CX+84}" y="${CY}" font-size="${fs2}" text-anchor="middle">${esc(p2)}</text>`;
      }
      if(p3){
        const startX=(p1||p2)?(CX+110):(CX+64);
        h+=`<text x="${startX}" y="${CY}" font-size="${fs3}" text-anchor="start">${esc(p3)}</text>`;
      }
      h+=`</g>`;
    }
  }

  // başlangıç/bitiş dikişi
  const [sx1,sy1]=pol(0,R_IN),[sx2,sy2]=pol(0,R_TICK);
  h+=`<line x1="${sx1}" y1="${sy1}" x2="${sx2}" y2="${sy2}" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3"/>`;

  // tikler + saat yazıları
  for(let m=START;m<END;m+=10){
    const ang=a4t(m), hour=m%60===0, half=m%30===0;
    const len=hour?16:(half?10:5);
    const [x1,y1]=pol(ang,R_TICK),[x2,y2]=pol(ang,R_TICK-len);
    h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${hour?"#f8fafc":"#cbd5e1"}" stroke-width="${hour?2:1}" opacity="${hour?0.95:0.65}"/>`;
    if(hour){
      const [tx,ty]=pol(ang,R_TICK+16);
      h+=`<text x="${tx}" y="${ty}" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle" dominant-baseline="central" transform="rotate(${ang} ${tx} ${ty})">${pad(m/60)}</text>`;
    }
  }
  rot.innerHTML=h;
}
function setRotation(){ rot.setAttribute("transform",`rotate(${(-a4t(viewTime)).toFixed(3)} ${CX} ${CY})`); }

// ---- durum kartları ----
function updateStatus(){
  const segs=segsFor(selDay), t=viewTime;
  const cur=segs.find(s=>t>=s.s&&t<s.e);
  const nxt=segs.find(s=>s.s>t);
  const cN=document.getElementById("curName"),cS=document.getElementById("curSub");
  const nN=document.getElementById("nextName"),nS=document.getElementById("nextSub");
  if(cur){
    cN.innerHTML=`<span class="dot" style="background:${cur.c}"></span>${esc(fullLabel(cur))}`;
    cS.textContent=`${fmt(cur.s)}–${fmt(cur.e)} · ${Math.ceil(cur.e-t)} dk`;
  }else{
    cN.textContent=segs.length?"Boş":"Program yok"; cS.textContent="";
  }
  if(nxt){
    nN.innerHTML=`<span class="dot" style="background:${nxt.c}"></span>${esc(fullLabel(nxt))}`;
    nS.textContent=`${fmt(nxt.s)} · ${Math.ceil(nxt.s-t)} dk sonra`;
  }else{nN.textContent="—"; nS.textContent="";}
  document.getElementById("clock").textContent=fmt(viewTime);
  const mode=document.getElementById("mode");
  const nowRaw=nowMin();
  mode.textContent=live?(nowRaw<START||nowRaw>END?"GÜN DIŞI":"ŞİMDİ"):"ELLE";
  mode.className="mode"+(live?"":" manual");
}
function refresh(){ setRotation(); updateStatus(); }

// ---- gün sekmeleri ----
function buildDays(){
  const el=document.getElementById("days"); el.innerHTML="";
  DAYS.forEach((d,i)=>{
    const b=document.createElement("button");
    b.textContent=d;
    b.className=(i===selDay?"sel ":"")+(i===todayIdx?"today":"");
    b.onclick=()=>{selDay=i; buildDays(); buildRing(); refresh();};
    el.appendChild(b);
  });
}

// ---- şimdi modu (doğru gün + doğru saat) ----
function nowMin(){const d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
function tick(){
  const tIdx=getTodayIdx();
  if(tIdx!==todayIdx){
    todayIdx=tIdx;
    buildDays();
  }
  if(live){ viewTime=clamp(nowMin()); refresh(); }
}
setInterval(tick,1000);

document.getElementById("nowBtn").onclick=()=>{
  todayIdx=getTodayIdx();
  if(todayIdx>=0 && selDay!==todayIdx){
    selDay=todayIdx;
    buildDays();
    buildRing();
  }
  live=true;
  viewTime=clamp(nowMin());
  refresh();
};

// ---- sürükleme ----
const svg=document.getElementById("svg");
function angOf(ev){
  const pt=svg.createSVGPoint();
  pt.x=ev.clientX; pt.y=ev.clientY;
  const ctm=svg.getScreenCTM();
  if(ctm){
    const p=pt.matrixTransform(ctm.inverse());
    return Math.atan2(p.y-CY, p.x-CX)*180/Math.PI;
  }
  const r=svg.getBoundingClientRect();
  const x=(ev.clientX-r.left)*(320/r.width), y=(ev.clientY-r.top)*(560/r.height);
  return Math.atan2(y-CY,x-CX)*180/Math.PI;
}
svg.addEventListener("pointerdown",ev=>{dragging=true; lastAng=angOf(ev); svg.setPointerCapture(ev.pointerId);});
svg.addEventListener("pointermove",ev=>{
  if(!dragging) return;
  let d=angOf(ev)-lastAng;
  if(d>180)d-=360; if(d<-180)d+=360;
  lastAng=angOf(ev);
  live=false;
  viewTime=clamp(viewTime - d/360*SPAN);
  refresh();
});
["pointerup","pointercancel"].forEach(e=>svg.addEventListener(e,()=>dragging=false));

// ---- düzenle modalı ----
const PALETTE=["#38bdf8","#4ade80","#fbbf24","#c084fc","#fb7185","#2dd4bf"];
const editorModal=document.getElementById("editorModal");

document.getElementById("editBtn").onclick=()=>{
  document.getElementById("advBox").open=false;
  buildEditor();
  editorModal.classList.add("open");
};
document.getElementById("closeEditor").onclick=()=>{
  editorModal.classList.remove("open");
  buildDays(); buildRing(); refresh();
};

function buildEditor(){
  document.getElementById("editTitle").textContent=DAYS[selDay]+" Programı";
  const edDays=document.getElementById("edDays"); edDays.innerHTML="";
  DAYS.forEach((d,i)=>{
    const b=document.createElement("button");
    b.textContent=d;
    if(i===selDay) b.className="sel";
    b.onclick=()=>{selDay=i; buildEditor();};
    edDays.appendChild(b);
  });

  const rows=document.getElementById("rows"); rows.innerHTML="";
  (schedule[selDay]||[]).forEach((b,i)=>{
    const card=document.createElement("div"); card.className="row-card";
    card.innerHTML=`
      <div class="row-line">
        <input class="f-p1" type="text" value="${esc(b.p1)}" placeholder="No/Ara" data-i="${i}" data-f="p1">
        <input class="f-p2" type="text" value="${esc(b.p2)}" placeholder="Sınıf" data-i="${i}" data-f="p2">
        <input class="f-n"  type="text" value="${esc(b.n)}"  placeholder="Ders adı" data-i="${i}" data-f="n">
      </div>
      <div class="row-line">
        <input type="color" value="${b.c}" data-i="${i}" data-f="c">
        <input type="time" value="${fmt(b.s)}" data-i="${i}" data-f="s">
        <input type="time" value="${fmt(b.e)}" data-i="${i}" data-f="e">
        <button class="del" data-i="${i}">✕</button>
      </div>`;
    rows.appendChild(card);
  });
  rows.querySelectorAll("input").forEach(el=>{
    el.onchange=()=>{
      const b=schedule[selDay][+el.dataset.i], f=el.dataset.f;
      if(f==="n"||f==="c"||f==="p1"||f==="p2") b[f]=el.value; else b[f]=toMin(el.value);
    };
  });
  rows.querySelectorAll(".del").forEach(el=>{
    el.onclick=()=>{schedule[selDay].splice(+el.dataset.i,1); buildEditor();};
  });
}

document.getElementById("addRow").onclick=()=>{
  const b=schedule[selDay]||(schedule[selDay]=[]);
  const last=b.length?Math.max(...b.map(x=>x.e)):toMin("08:30");
  b.push({p1:"", p2:"", n:"", c:PALETTE[b.length%PALETTE.length], s:Math.min(last,END-40), e:Math.min(last+40,END)});
  buildEditor();
};
document.getElementById("copyDay").onclick=()=>{
  if(!confirm(DAYS[selDay]+" programı diğer tüm günlerin üzerine yazılacak. Emin misiniz?")) return;
  for(let i=0;i<5;i++) if(i!==selDay) schedule[i]=schedule[selDay].map(b=>({...b}));
  saveStore();
  document.getElementById("advBox").open=false;
  toast("Tüm günlere kopyalandı.");
};
document.getElementById("saveBtn").onclick=()=>{
  schedule[selDay].sort((a,b)=>a.s-b.s);
  saveStore(); buildDays(); buildRing(); buildEditor(); refresh(); toast("Kaydedildi.");
};
function toast(msg){
  const n=document.createElement("div");
  n.textContent=msg;
  n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22c55e;color:#06230f;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:30";
  document.body.appendChild(n); setTimeout(()=>n.remove(),1600);
}

// ---- başlat ----
viewTime=clamp(nowMin());
buildDays(); buildRing(); refresh();
</script>
</body>
</html>
